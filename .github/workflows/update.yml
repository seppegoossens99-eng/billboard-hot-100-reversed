name: Update Billboard Hot 100 Reversed

on:
  schedule:
    # Wednesday at 12:00 Europe/Brussels, including daylight-saving changes.
    - cron: '0 10,11 * * 3'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: billboard-hot-100-reversed
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Generate details CSV
        run: python generate_details.py
      - name: Commit details CSV
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add billboard_hot_100_details.csv billboard_hot_100_artists.csv
          if ! git diff --cached --quiet; then
            git commit -m "Update Billboard details CSV"
            git push
          fi
      - name: Update Spotify playlist
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
          SPOTIFY_PLAYLIST_ID: ${{ secrets.SPOTIFY_PLAYLIST_ID }}
        run: python update_spotify.py
