name: Update Billboard Hot 100 Reversed

on:
  schedule:
    # Wednesday at 12:00 Europe/Brussels, including daylight-saving changes.
    - cron: '0 10,11 * * 3'
  push:
    branches:
      - main
    paths:
      - '*.py'
      - 'requirements.txt'
      - '.github/workflows/update.yml'
  workflow_dispatch:
    inputs:
      update_spotify:
        description: "Spotify-playlist ook bijwerken? Laat uit voor website-only updates."
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: billboard-hot-100-reversed
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Check Belgian Wednesday update time
        id: clock
        env:
          EVENT: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo
          now = datetime.now(ZoneInfo("Europe/Brussels"))
          proceed = os.environ["EVENT"] != "schedule" or (now.weekday() == 2 and now.hour == 12)
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write('proceed=' + ('true' if proceed else 'false') + chr(10))
          print("Brussels time:", now, "Run:", proceed)
          PY
      - name: Update Spotify playlist
        id: spotify
        if: steps.clock.outputs.proceed == 'true' && (github.event_name == 'schedule' || inputs.update_spotify == true)
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
          SPOTIFY_PLAYLIST_ID: ${{ secrets.SPOTIFY_PLAYLIST_ID }}
        run: python update_spotify.py
      - name: Verify artist-name parsing
        if: steps.clock.outputs.proceed == 'true'
        run: python -m unittest test_artist_parsing.py
      - name: Generate details CSV
        if: steps.clock.outputs.proceed == 'true' && ((github.event_name != 'schedule' && inputs.update_spotify != true) || steps.spotify.outcome == 'success')
        run: python generate_details.py
      - name: Collect band members and roles
        if: steps.clock.outputs.proceed == 'true' && ((github.event_name != 'schedule' && inputs.update_spotify != true) || steps.spotify.outcome == 'success')
        run: python collect_band_members.py
      - name: Enrich band member ages and instruments
        if: steps.clock.outputs.proceed == 'true' && ((github.event_name != 'schedule' && inputs.update_spotify != true) || steps.spotify.outcome == 'success')
        run: python enrich_band_members.py
      - name: Collect artist photos and ages
        if: steps.clock.outputs.proceed == 'true' && ((github.event_name != 'schedule' && inputs.update_spotify != true) || steps.spotify.outcome == 'success')
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
        run: python collect_artist_profiles.py
      - name: Report missing metadata
        if: steps.clock.outputs.proceed == 'true' && ((github.event_name != 'schedule' && inputs.update_spotify != true) || steps.spotify.outcome == 'success')
        run: python metadata_quality_report.py
      - name: Build mobile HTML overview
        if: steps.clock.outputs.proceed == 'true' && ((github.event_name != 'schedule' && inputs.update_spotify != true) || steps.spotify.outcome == 'success')
        run: python build_mobile_page.py
      - name: Prepare website homepage
        if: steps.clock.outputs.proceed == 'true' && ((github.event_name != 'schedule' && inputs.update_spotify != true) || steps.spotify.outcome == 'success')
        run: cp billboard_hot_100.html index.html
      - name: Commit details CSV
        if: steps.clock.outputs.proceed == 'true' && ((github.event_name != 'schedule' && inputs.update_spotify != true) || steps.spotify.outcome == 'success')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add billboard_hot_100_details.csv billboard_hot_100_artists.csv billboard_band_members.csv band_members_cache.json band_member_ages_cache.json billboard_artist_profiles.csv billboard_hot_100.html index.html metadata_quality_report.md billboard_chart_date.txt
          if ! git diff --cached --quiet; then
            git commit -m "Update Billboard details CSV"
            git push
          fi
